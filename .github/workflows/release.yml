name: Release

on:
  workflow_dispatch:
    inputs:
      maven_tag:
        description: "Publish only the Java SDK from an existing release tag (vX.Y.Z). Leave empty for a normal release."
        type: string
        required: false

jobs:
  release:
    name: Release
    if: inputs.maven_tag == ''
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Execute Gradle build
        run: ./gradlew build
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "8.0.x"
      - name: Install semantic-release
        run: |
          npm install --force
          npm config set access public
      - name: Compile TypeScript
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - run: pip install --upgrade tomlkit hatchling build pkginfo twine setuptools
      - name: Authenticate with NuGet.org
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          NUGET_TOKEN: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import semanticRelease from 'semantic-release';

          const release = await semanticRelease();
          if (release) {
            appendFileSync(process.env.GITHUB_OUTPUT, `tag=${release.nextRelease.gitTag}\n`);
          }
          NODE

  maven-central:
    name: Publish to Maven Central
    needs: release
    if: ${{ !cancelled() && (inputs.maven_tag != '' || (needs.release.result == 'success' && needs.release.outputs.tag != '')) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.maven_tag || needs.release.outputs.tag }}
    steps:
      - name: Read version from release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release tag of the form vX.Y.Z" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish signed Java SDK
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GRADLE_SIGNING_KEY: ${{ secrets.GRADLE_SIGNING_KEY }}
          GRADLE_SIGNING_PASSWORD: ${{ secrets.GRADLE_SIGNING_PASSWORD }}
        run: |
          : "${MAVEN_CENTRAL_USERNAME:?Set the Central Portal token username}"
          : "${MAVEN_CENTRAL_PASSWORD:?Set the Central Portal token password}"
          : "${GRADLE_SIGNING_KEY:?Set the Java SDK signing key}"
          : "${GRADLE_SIGNING_PASSWORD:?Set the signing key password}"
          ./gradlew publishAggregationToCentralPortal -Pversion="$RELEASE_VERSION"
